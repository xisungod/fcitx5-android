name: Deliver exact verified AXiang touch8 APK

on:
  push:
    branches: ["delivery/axiang-touch8-relay"]
    paths:
      - ".github/workflows/touch8-exact-relay.yml"
      - ".github/axiang-touch8-relay.json"
      - ".github/axiang-touch8-identity.json"
      - "scripts/relay-exact-touch8.py"

concurrency:
  group: axiang-touch8-exact-delivery
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'xisungod/fcitx5-android' && github.ref == 'refs/heads/delivery/axiang-touch8-relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_SHA256: 81d8769d99909f80c752ec0c9c1685bf2bcabd6ead57f763fd1c22dbe08f05da
      IDENTITY_SHA256: 2e77579c31d8f6ccb6cf4e25bb6e2da49f4cc6b49840beb01665b1f8497c4fd5
      SOURCE_COMMIT: 5b27a0489eb21dc317957740b580ac89eba4531b
      RELEASE_ID: "405680695"
      RELEASE_TAG: axiang-touch-1.2-touch.8
      APK_SHA256: 5f04bd499df1552878cf353cad882bad709837d6f3ad257edcd34cb26e6eb441
      SIGNER_SHA256: ffede124b18d54af5d4cfa9f3a32504fa2ccc898563bc4816bacbe3e46ec0494
    steps:
      - name: Read the reviewed relay instructions only
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reconstruct the exact previously tested signed APK without any signing key
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/relay-exact-touch8.py \
            --identity .github/axiang-touch8-identity.json \
            --identity-sha256 "$IDENTITY_SHA256" restore \
            --manifest .github/axiang-touch8-relay.json \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --output "$RUNNER_TEMP/axiang-touch8-exact" \
            --github-token

      - name: Prepare public Android verification tools
        uses: android-actions/setup-android@v4

      - name: Verify the actual exact APK signature and 16 KiB alignment again
        run: |
          sdkmanager --install "build-tools;36.1.0"
          apk="$RUNNER_TEMP/axiang-touch8-exact/AXiang-1.2-touch.8-arm64.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$apk" \
            > "$RUNNER_TEMP/touch8-signature-proof.txt"
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$apk" \
            > "$RUNNER_TEMP/touch8-package-proof.txt"
          python3 -B - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          signature=(root/'touch8-signature-proof.txt').read_text()
          certs=re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$',signature,re.M)
          if [v.lower() for v in certs] != [os.environ['SIGNER_SHA256']]:
              raise SystemExit('Actual APK signer differs from the already verified durable touch2 signer')
          package=(root/'touch8-package-proof.txt').read_text()
          expected="package: name='org.fcitx.fcitx5.android.axiang.touch2' versionCode='9' versionName='1.2-touch.8'"
          if not package.startswith(expected) or "native-code: 'arm64-v8a'" not in package:
              raise SystemExit('Actual APK package/version/ABI differs')
          print('Exact previously tested APK signature, package identity and alignment verified')
          PY

      - name: Upload only exact reviewed public files to their existing source-pinned draft
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before-relay.json"
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,urllib.parse
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          release=json.loads((root/'release-before-relay.json').read_text())
          expected=(int(os.environ['RELEASE_ID']),os.environ['RELEASE_TAG'],os.environ['SOURCE_COMMIT'],True,True)
          actual=(release.get('id'),release.get('tag_name'),release.get('target_commitish'),release.get('draft'),release.get('prerelease'))
          if actual != expected:
              raise SystemExit('Refusing upload: existing draft/source/tag identity differs')
          if release.get('assets'):
              raise SystemExit('Refusing upload: this initial-delivery draft is no longer empty; review existing assets before a recovery run')
          folder=root/'axiang-touch8-exact'
          def digest(p):
              with p.open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          for line in (folder/'SHA256SUMS.txt').read_text().splitlines():
              checksum,name=line.split('  ',1)
              if Path(name).name!=name or digest(folder/name)!=checksum:
                  raise SystemExit('Reviewed public file changed after exact reconstruction')
          if digest(folder/'AXiang-1.2-touch.8-arm64.apk')!=os.environ['APK_SHA256']:
              raise SystemExit('Exact APK changed before upload')
          upload_url=release['upload_url'].split('{',1)[0]
          required_url='https://uploads.github.com/repos/xisungod/fcitx5-android/releases/405680695/assets'
          if upload_url != required_url:
              raise SystemExit('Existing draft upload endpoint differs')
          # GitHub normalizes non-ASCII release filenames. Use an explicit public
          # ASCII alias for the unchanged guide bytes, leaving all reviewed files
          # and checksum metadata unchanged.
          aliases={}
          public={aliases.get(p.name,p.name):p for p in folder.iterdir() if p.is_file()}
          release_checksums=root/'SHA256SUMS.release.txt'
          release_checksums.write_text(''.join(digest(path)+'  '+name+'\n' for name,path in sorted(public.items())),encoding='utf-8')
          public['SHA256SUMS.release.txt']=release_checksums
          for name,path in sorted(public.items()):
              command=['gh','api','--method','POST',upload_url+'?'+urllib.parse.urlencode({'name':name}),
                       '--input',str(path),'--header','Content-Type: application/octet-stream',
                       '--header','X-GitHub-Api-Version: 2022-11-28']
              result=subprocess.run(command,capture_output=True,text=True)
              if result.returncode:
                  raise SystemExit('Source-pinned draft asset upload failed: '+name)
              asset=json.loads(result.stdout)
              if asset.get('name')!=name or asset.get('state')!='uploaded' or \
                 asset.get('size')!=path.stat().st_size or asset.get('digest')!='sha256:'+digest(path):
                  raise SystemExit('Uploaded draft asset response differs: '+name)
              check=subprocess.run(['gh','api','repos/xisungod/fcitx5-android/releases/'+os.environ['RELEASE_ID']],
                                   capture_output=True,text=True,check=True)
              current=json.loads(check.stdout)
              identity=(current.get('id'),current.get('tag_name'),current.get('target_commitish'),current.get('draft'),current.get('prerelease'))
              if identity!=expected or current.get('upload_url','').split('{',1)[0]!=upload_url:
                  raise SystemExit('Draft identity changed during the exact-file upload')
              print('Uploaded exact public bytes: '+name)
          PY

      - name: Verify uploaded draft assets against exact reviewed hashes and sizes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-after-relay.json"
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          folder=root/'axiang-touch8-exact'
          release=json.loads((root/'release-after-relay.json').read_text())
          if (release['id'],release['tag_name'],release['target_commitish'],release['draft']) != \
             (int(os.environ['RELEASE_ID']),os.environ['RELEASE_TAG'],os.environ['SOURCE_COMMIT'],True):
              raise SystemExit('Draft identity changed during upload')
          aliases={}
          expected={aliases.get(p.name,p.name):p for p in folder.iterdir() if p.is_file()}
          expected['SHA256SUMS.release.txt']=root/'SHA256SUMS.release.txt'
          assets={a['name']:a for a in release['assets']}
          if set(assets)!=set(expected) or len(assets)!=len(release['assets']):
              raise SystemExit('Draft public asset names differ or duplicate assets exist')
          for name,path in expected.items():
              with path.open('rb') as stream:checksum=hashlib.file_digest(stream,'sha256').hexdigest()
              asset=assets[name]
              if asset['state']!='uploaded' or asset['size']!=path.stat().st_size or \
                 asset.get('digest')!='sha256:'+checksum:
                  raise SystemExit('Uploaded draft asset bytes/state differ: '+name)
          print('All exact reviewed files are on the source-pinned draft; publication is a separate operation')
          PY

      - name: Preserve the exact signed public delivery backup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axiang-touch8-exact-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/axiang-touch8-exact/
            ${{ runner.temp }}/touch8-signature-proof.txt
            ${{ runner.temp }}/touch8-package-proof.txt
            ${{ runner.temp }}/SHA256SUMS.release.txt
          if-no-files-found: ignore
          retention-days: 14
