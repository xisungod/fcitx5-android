name: 曜黑 V14 柔光与功能页构建

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 已确认界面，发布安装包
        type: boolean
        default: false
  push:
    branches: ["improve/keyscafe-black-v14"]
    paths: ["xuancai.patch", "scripts/**", ".github/workflows/xuancai.yml"]

concurrency:
  group: xuancai-v14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: 切到已验证版本并应用补丁
        run: |
          cp xuancai.patch /tmp/xuancai.patch
          cp XUANCAI-V14.md /tmp/XUANCAI-V14.md
          cp -r scripts /tmp/xuancai-v14-scripts
          git -c advice.detachedHead=false checkout e6199a2801b0c76e1baeff7a48f6b18e910e9dd7
          git submodule update --init --recursive
          git apply --whitespace=nowarn /tmp/xuancai.patch
      - name: 准备完整雾凇与固定语法模型
        run: python3 /tmp/xuancai-v14-scripts/prepare-xuancai-rime.py --zip /tmp/xuancai-v14-rime-data.zip
      - name: 准备 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
      - name: 安装 CMake 与 Rime 验证依赖
        run: |
          sdkmanager --install "cmake;3.31.6"
          sudo apt-get update -qq
          sudo apt-get install -y extra-cmake-modules gettext cmake ninja-build pkg-config libboost-regex-dev libyaml-cpp-dev libmarisa-dev libopencc-dev libleveldb-dev liblua5.4-dev libgoogle-glog-dev python3-yaml
      - name: 准备固定签名（无密钥时使用独立体验包）
        env:
          XUANCAI_SIGN_KEY_BASE64: ${{ secrets.XUANCAI_SIGN_KEY_BASE64 }}
          XUANCAI_SIGN_KEY_PWD: ${{ secrets.XUANCAI_SIGN_KEY_PWD }}
          XUANCAI_SIGN_KEY_ALIAS: ${{ secrets.XUANCAI_SIGN_KEY_ALIAS }}
        run: python3 /tmp/xuancai-v14-scripts/prepare-xuancai-signing.py
      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: 编译主程序并运行界面测试
        env:
          BUILD_ABI: arm64-v8a
          BUILD_VERSION_NAME: xuancai-black-v14
          SIGN_KEY_PWD: ${{ secrets.XUANCAI_SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.XUANCAI_SIGN_KEY_ALIAS }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee /tmp/app-build.log
      - name: 报告编译与测试错误
        if: failure()
        run: |
          # Kotlin compiler errors -> annotations (readable through the API)
          grep -E '^e: ' /tmp/app-build.log | head -20 | while IFS= read -r line; do
            echo "::error title=kotlin::${line:0:900}"
          done
          # failed unit tests -> annotations with the assertion message
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or bad.text or '').replace('\n', ' ')[:700]
                      print(f"::error title=test::{case.get('classname')}.{case.get('name')}: {msg}")
                      n += 1
          print('failed tests:', n)
          PY
          grep -E 'FAILURE|What went wrong' -A4 /tmp/app-build.log | head -30 | while IFS= read -r line; do
            echo "::warning title=gradle::${line:0:500}"
          done
      - name: 优先保留界面确认图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xuancai-v14-ui-checks
          path: |
            app/build/outputs/effect-checks/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: 预编译词典并验证真实 Rime 候选
        run: python3 /tmp/xuancai-v14-scripts/precompile-xuancai-rime.py --work "$RUNNER_TEMP/xuancai-rime-host"
      - name: 编译配套 Rime 插件
        env:
          BUILD_ABI: arm64-v8a
          BUILD_VERSION_NAME: xuancai-black-v14
          SIGN_KEY_PWD: ${{ secrets.XUANCAI_SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.XUANCAI_SIGN_KEY_ALIAS }}
        run: ./gradlew :plugin:rime:assembleDebug
      - name: 保留候选验证、绘制图与测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xuancai-v14-checks
          path: |
            app/build/outputs/effect-checks/
            app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/xuancai-rime-host/checks/
          if-no-files-found: ignore
      - name: 整理并校验安装包
        run: |
          mkdir -p /tmp/xuancai-v14
          cp app/build/outputs/apk/debug/*.apk /tmp/xuancai-v14/fcitx5-xuancai-black-v14-arm64.apk
          cp plugin/rime/build/outputs/apk/debug/*.apk /tmp/xuancai-v14/fcitx5-rime-black-v14-arm64.apk
          cp /tmp/xuancai-v14-rime-data.zip /tmp/xuancai-v14/
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$SDK_TOOLS/apksigner" verify --verbose /tmp/xuancai-v14/fcitx5-xuancai-black-v14-arm64.apk
          "$SDK_TOOLS/apksigner" verify --verbose /tmp/xuancai-v14/fcitx5-rime-black-v14-arm64.apk
          "$SDK_TOOLS/aapt" dump badging /tmp/xuancai-v14/fcitx5-xuancai-black-v14-arm64.apk > /tmp/app-badging.txt
          sed -n '1,6p' /tmp/app-badging.txt
          "$SDK_TOOLS/aapt" dump badging /tmp/xuancai-v14/fcitx5-rime-black-v14-arm64.apk > /tmp/rime-badging.txt
          sed -n '1,6p' /tmp/rime-badging.txt
          python3 /tmp/xuancai-v14-scripts/verify-xuancai-rime-package.py /tmp/xuancai-v14/fcitx5-rime-black-v14-arm64.apk
          cd /tmp/xuancai-v14
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: fcitx5-xuancai-black-v14-and-rime-arm64
          path: /tmp/xuancai-v14/*
      - name: 发布（允许同提交重跑）
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash /tmp/xuancai-v14-scripts/publish-xuancai-v14.sh
      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/xuancai-signing.ks"
