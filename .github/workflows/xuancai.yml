name: 曜黑 V07 与 Rime 构建

on:
  workflow_dispatch:
  push:
    branches:
      - "redesign/keyscafe-black-v07"
    paths:
      - "xuancai.patch"
      - "scripts/**"
      - ".github/workflows/xuancai.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 切到已验证的版本并打上炫彩补丁
        run: |
          cp xuancai.patch /tmp/xuancai.patch
          cp XUANCAI-V07.md /tmp/XUANCAI-V07.md
          cp scripts/prepare-xuancai-rime.py /tmp/prepare-xuancai-rime.py
          git -c advice.detachedHead=false checkout e6199a2801b0c76e1baeff7a48f6b18e910e9dd7
          git submodule update --init --recursive
          git apply --whitespace=nowarn /tmp/xuancai.patch
          git status --short

      - name: 准备固定版本的雾凇词库
        run: python3 /tmp/prepare-xuancai-rime.py --zip /tmp/xuancai-v07-rime-data.zip

      - name: 准备 Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 编译曜黑主程序、配套 Rime 并运行测试（arm64）
        env:
          BUILD_ABI: arm64-v8a
          BUILD_VERSION_NAME: "xuancai-black-v07"
        run: ./gradlew :app:assembleDebug :plugin:rime:assembleDebug :app:testDebugUnitTest

      - name: 保留绘制验证图与测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xuancai-v07-render-checks
          path: |
            app/build/outputs/effect-checks/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 整理并校验安装包
        run: |
          mkdir -p /tmp/xuancai-v07
          cp app/build/outputs/apk/debug/*.apk /tmp/xuancai-v07/fcitx5-xuancai-black-v07-arm64.apk
          cp plugin/rime/build/outputs/apk/debug/*.apk /tmp/xuancai-v07/fcitx5-rime-black-v07-arm64.apk
          cp /tmp/xuancai-v07-rime-data.zip /tmp/xuancai-v07/
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$SDK_TOOLS/apksigner" verify --verbose /tmp/xuancai-v07/fcitx5-xuancai-black-v07-arm64.apk
          "$SDK_TOOLS/apksigner" verify --verbose /tmp/xuancai-v07/fcitx5-rime-black-v07-arm64.apk
          "$SDK_TOOLS/aapt" dump badging /tmp/xuancai-v07/fcitx5-xuancai-black-v07-arm64.apk > /tmp/main-badging.txt
          "$SDK_TOOLS/aapt" dump badging /tmp/xuancai-v07/fcitx5-rime-black-v07-arm64.apk > /tmp/rime-badging.txt
          sed -n '1,6p' /tmp/main-badging.txt
          sed -n '1,6p' /tmp/rime-badging.txt
          cd /tmp/xuancai-v07
          sha256sum *.apk *.zip > SHA256SUMS.txt

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: fcitx5-xuancai-black-v07-and-rime-arm64
          path: /tmp/xuancai-v07/*

      - name: 发布到 Release（手机可直接下载 apk）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create xuancai-black-v07 /tmp/xuancai-v07/* \
            --target "$GITHUB_SHA" \
            --title "炫彩·曜黑 V07 + Rime（arm64）" \
            --notes-file /tmp/XUANCAI-V07.md --prerelease --latest=false
