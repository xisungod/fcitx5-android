name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize
  # The Run workflow button builds the selected branch without a pull request event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiang-pr-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build_pull_request:
    # Reuse the signed baseline's native libraries and offline speech assets.
    # Only the explicitly verified Rime data overlay may change.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_ABI: arm64-v8a
      BUILD_VERSION_CODE: "18"
      BUILD_VERSION_NAME: 1.2-touch.10.3
      BUILD_COMMIT_HASH: ${{ github.sha }}
      XUANCAI_APP_SUFFIX: .axiang.touch10
      APP_LABEL: 阿翔 触点测试10
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install the pinned SDK tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.1.0"

      - name: Verify and extract the published touch.8.2.2 assets and native libraries
        run: |
          python3 scripts/prepare-axiang-touch9-build.py prepare \
            --work "$RUNNER_TEMP/axiang-touch9" --label "$APP_LABEL"

      - name: Install host tools for Rime schema compilation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config libboost-regex-dev libyaml-cpp-dev libmarisa-dev libopencc-dev libleveldb-dev liblua5.4-dev libgoogle-glog-dev

      - name: Apply and verify the bounded Pinyin corrections
        run: |
          python3 scripts/prepare-touch-rime-corrections.py --work "$RUNNER_TEMP/axiang-touch9"
          python3 scripts/test-axiang-single-edit-corrections.py \
            --stage "$RUNNER_TEMP/axiang-touch9/prebuilt/assets/usr/share/rime-data"

      # This upstream LTS URL is mutable. Reuse the already hash-verified
      # payload if the publisher updates the URL or a runner must be retried.
      - name: Cache the pinned Rime dictionary downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/axiang-touch9/downloads/rime-overlay
          key: axiang-rime-lts-20261114-zhwiki-0.3.1-v1

      - name: Precompile and evaluate the pinned Wanxiang LTS and zhwiki overlay
        run: |
          python3 scripts/prepare-touch-rime-lexicon.py --work "$RUNNER_TEMP/axiang-touch9"

      - name: Precompile the default-off Rime encyclopedia hooks
        run: |
          python3 scripts/prepare-touch-rime-moegirl-hooks.py --work "$RUNNER_TEMP/axiang-touch9"

      # Later builds of the same pull request keep one debug certificate, so a newer
      # test package installs over the previous one.
      - name: Reuse this pull request's debug certificate
        id: debug_certificate
        uses: actions/cache/restore@v5
        with:
          path: ~/.android/debug.keystore
          key: axiang-touch10-debug-certificate-v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the test APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            -I "$RUNNER_TEMP/axiang-touch9/touch9.init.gradle" \
            :app:assembleDebug \
            -x :app:generateDataDescriptor \
            -x :app:installFcitxComponent \
            -x :app:deleteFcitxComponentExcludeFiles \
            2>&1 | tee "$RUNNER_TEMP/axiang-touch9/build.log"

      # Saved here, not at the end of the job: a failing later check must not throw the
      # certificate away, or the next package could not be installed over this one.
      - name: Keep the debug certificate for later builds
        if: steps.debug_certificate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.android/debug.keystore
          key: axiang-touch10-debug-certificate-v2

      - name: Verify the signature, alignment and exact staged assets and libraries
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/axiang-pr"
          apk="$RUNNER_TEMP/axiang-pr/AXiang-$BUILD_VERSION_NAME-arm64.apk"
          cp "${apks[0]}" "$apk"
          sdk_tools="$ANDROID_HOME/build-tools/36.1.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs "$apk"
          "$sdk_tools/zipalign" -c -P 16 4 "$apk"
          "$sdk_tools/aapt" dump badging "$apk" | head -n 3
          python3 scripts/prepare-axiang-touch9-build.py verify \
            --work "$RUNNER_TEMP/axiang-touch9" --apk "$apk" \
            --rime-overlay single-edit-corrections-v1 --rime-overlay wanxiang-zhwiki-v1 \
            --rime-overlay moegirl-hooks-v1
          cd "$RUNNER_TEMP/axiang-pr"
          sha256sum "AXiang-$BUILD_VERSION_NAME-arm64.apk" > SHA256SUMS.txt

      - name: Upload the test APK
        uses: actions/upload-artifact@v7
        with:
          name: axiang-touch10-${{ github.run_id }}-arm64
          path: ${{ runner.temp }}/axiang-pr/*
          if-no-files-found: error
          retention-days: 14

      # Frames of the real keyboard's light effect, printed into the log as text so they
      # can be read back and compared with a reference recording without a phone.
      - name: Render the light effect probe
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -I "$RUNNER_TEMP/axiang-touch9/touch9.init.gradle" \
            :app:testDebugUnitTest --tests '*LightEffectProbeTest*' \
            -x :app:generateDataDescriptor \
            -x :app:installFcitxComponent \
            -x :app:deleteFcitxComponentExcludeFiles
          for probe in one-press typing fast-typing; do
            test -s "app/build/outputs/effect-checks/probe/$probe.jpg"
          done
          for image in app/build/outputs/effect-checks/probe/*.jpg; do
            [ -f "$image" ] || continue
            echo "PROBE-BEGIN $(basename "$image")"
            base64 -w 160 "$image" | sed 's/^/PROBE:/'
            echo "PROBE-END"
          done

      # After the APK upload: a failing check still fails this job, but no longer
      # withholds the package from the person who has to try it on a phone.
      - name: Verify the package contents, permissions and identity
        run: |
          sdk_tools="$ANDROID_HOME/build-tools/36.1.0"
          python3 scripts/verify-xuancai-rime-package.py \
            "$RUNNER_TEMP/axiang-pr/AXiang-$BUILD_VERSION_NAME-arm64.apk" \
            --bundled-rime --offline-dictation --wanxiang-zhwiki --aapt "$sdk_tools/aapt" --apksigner "$sdk_tools/apksigner" \
            --expected-main-package "org.fcitx.fcitx5.android${XUANCAI_APP_SUFFIX}" \
            --expected-app-label "$APP_LABEL" \
            --expected-version-name "$BUILD_VERSION_NAME" --expected-version-code "$BUILD_VERSION_CODE"

      - name: Run JVM tests
        if: always()
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            -I "$RUNNER_TEMP/axiang-touch9/touch9.init.gradle" \
            :app:testDebugUnitTest \
            -x :app:generateDataDescriptor \
            -x :app:installFcitxComponent \
            -x :app:deleteFcitxComponentExcludeFiles \
            2>&1 | tee "$RUNNER_TEMP/axiang-touch9/test.log"

      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axiang-touch10-checks-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/effect-checks/
            ${{ runner.temp }}/axiang-touch9/build.log
            ${{ runner.temp }}/axiang-touch9/test.log
            ${{ runner.temp }}/axiang-touch9/prebuilt-manifest.json
            ${{ runner.temp }}/axiang-touch9/staged-inputs-manifest.json
            ${{ runner.temp }}/axiang-touch9/rime-moegirl-hooks.json
            ${{ runner.temp }}/axiang-touch9/rime-precompile.json
            ${{ runner.temp }}/axiang-touch9/rime-sentence-ab.json
            ${{ runner.temp }}/axiang-touch9/rime-sentence-*.log
          if-no-files-found: warn
          retention-days: 14
